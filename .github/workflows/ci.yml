name: 检查 PR
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: space-invader-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser
      - name: 上传浏览器基线截图（仅供验收留痕）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-baseline-${{ github.sha }}
          path: |
            test-results/**/p3-*.png
            test-results/**/p4-*.png
            test-results/**/desktop-baseline.png
            test-results/**/narrow-baseline.png
            test-results/**/fx-*.png
            test-results/**/scout-models.png
            test-results/**/raider-models.png
            test-results/**/guardian-models.png
            test-results/**/guardian-narrow-models.png
            test-results/**/touch-*.png
            test-results/**/mobile-gpu-performance.json
            test-results/**/p3-*.json
            test-results/**/p4-*.json
            test-results/**/video.webm
            artifacts/p3-asset-audit.json
          retention-days: 7
          if-no-files-found: ignore
