name: 发布 GitHub Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: space-invader-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: 记录产物对应的 Git 提交
        run: echo "$GITHUB_SHA" > dist/build-sha.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 检查线上 Pages 版本及静态资源
        shell: bash
        run: |
          set -euo pipefail
          base="https://siliconyc.github.io/React-SpaceInvader"
          live_sha=""
          for attempt in $(seq 1 18); do
            live_sha=$(curl --silent --show-error --fail --location --max-time 12 "$base/build-sha.txt" || true)
            if [[ "$live_sha" == "$GITHUB_SHA" ]]; then break; fi
            sleep 5
          done
          [[ "$live_sha" == "$GITHUB_SHA" ]] || { echo "::error::线上未更新到当前提交"; exit 1; }
          curl --fail --silent --show-error --location "$base/" -o /tmp/invader-index.html
          grep -q '/React-SpaceInvader/assets/' /tmp/invader-index.html
          js_asset=$(grep -oE '/React-SpaceInvader/assets/[^"]+[.]js' /tmp/invader-index.html | head -n1)
          [[ -n "$js_asset" ]]
          curl --fail --silent --show-error --location "https://siliconyc.github.io$js_asset" -o /tmp/invader-app.js
          test -s /tmp/invader-app.js
          echo "线上已发布 $GITHUB_SHA；首页及 JS 资源可访问"
      - name: 线上 Chromium 与 WebGL 验收
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - name: 实测部署后的 Pages（场景、命令、缩放、控制台异常）
        run: npm run test:browser
        env:
          E2E_BASE_URL: https://siliconyc.github.io/React-SpaceInvader/
      - name: 上传真实浏览器截屏留痕
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-live-baseline-${{ github.sha }}
          path: |
            test-results/**/p3-*.png
            test-results/**/p4-*.png
            test-results/**/desktop-baseline.png
            test-results/**/narrow-baseline.png
            test-results/**/fx-*.png
            test-results/**/scout-models.png
            test-results/**/raider-models.png
            test-results/**/guardian-models.png
            test-results/**/guardian-narrow-models.png
            test-results/**/touch-*.png
            test-results/**/mobile-gpu-performance.json
            test-results/**/p3-*.json
            test-results/**/p4-*.json
            test-results/**/video.webm
            artifacts/p3-asset-audit.json
          retention-days: 7
          if-no-files-found: ignore
