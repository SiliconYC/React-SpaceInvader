name: P3 单次美术源图生成
on:
  push:
    branches: [issue-42-p3-galaxy-background]
    paths: [scripts/art/generate_galaxy.py]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pillow numpy
      - run: python scripts/art/generate_galaxy.py --variant 2 --output public/art/backgrounds
      - name: 原图与优化 WebP 原子化保存 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/backgrounds/galaxy-v2-source.png public/art/backgrounds/galaxy-v2.webp
          git commit -m "art(#42): commit rendered original PNG and optimized WebP binaries"
          git push origin HEAD:issue-42-p3-galaxy-background
